<!-- Exit Clean Mode Pill Action -->

<!-- Lower Cockpit: Ultra-Clean Floating Shutter & Status -->
<div class="absolute bottom-4 left-0 right-0 z-30 flex flex-col items-center gap-3 pointer-events-none">
<!-- Minimalist OLED Immersion Breadcrumb -->

<div class="relative flex items-center justify-center pointer-events-auto">

<script>
  (function initCleanViewfinder() {
    const root = document.getElementById('clean-viewfinder-root');
    const canvas = document.getElementById('light-tracer-canvas');
    const timerElem = document.getElementById('bulb-timer');
    const shutterBtn = document.getElementById('clean-shutter-trigger');
    const shutterCore = document.getElementById('shutter-core');
    const shutterIcon = document.getElementById('shutter-icon');
    const exitBtn = document.getElementById('exit-clean-mode-btn');
    const restoreToast = document.getElementById('control-restore-toast');
    const toastCancel = document.getElementById('toast-cancel-btn');
    const toastConfirm = document.getElementById('toast-confirm-btn');
    const gestureHint = document.getElementById('gesture-hint-card');

    if (!canvas || !root) return;

    // Canvas Real-Time Light Stroke Animation (Simulating Live Astrophotography Exposure Painting)
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = canvas.parentElement.clientWidth);
    let height = (canvas.height = canvas.parentElement.clientHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = canvas.parentElement.clientWidth;
      height = canvas.height = canvas.parentElement.clientHeight;
    });

    let isCapturing = true;
    let exposureSeconds = 15.4;
    let particles = [];
    const maxParticles = 65;

    class LightSpur {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = width * (0.35 + Math.random() * 0.3);
        this.y = height * (0.55 + Math.random() * 0.25);
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 1.2 + Math.random() * 2.2;
        this.radius = 1.0 + Math.random() * 2.4;
        this.life = 0;
        this.maxLife = 90 + Math.random() * 120;
        this.alpha = 0.8;
      }
      step() {
        this.life++;
        this.angle += (Math.random() - 0.5) * 0.35;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed * 0.7;

        if (this.life > this.maxLife) {
          this.reset();
        }
      }
      draw(c) {
        c.save();
        c.beginPath();
        c.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        c.fillStyle = `rgba(0, 255, 204, ${Math.max(0, (1 - this.life / this.maxLife) * 0.75)})`;
        c.shadowColor = 'rgba(0, 255, 204, 0.9)';
        c.shadowBlur = 10;
        c.fill();
        c.restore();
      }
    }

    for (let i = 0; i < maxParticles; i++) {
      particles.push(new LightSpur());
    }

    // Render loop
    function animate() {
      if (isCapturing) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
        ctx.fillRect(0, 0, width, height);

        particles.forEach((p) => {
          p.step();
          p.draw(ctx);
        });
      }
      requestAnimationFrame(animate);
    }
    animate();

    // Live Exposure Counter
    const timerInterval = setInterval(() => {
      if (isCapturing && timerElem) {
        exposureSeconds += 0.1;
        timerElem.textContent = exposureSeconds.toFixed(1) + 's';
      }
    }, 100);

    // Fade Gesture Hint after 4.5 seconds
    setTimeout(() => {
      if (gestureHint) {
        gestureHint.style.opacity = '0';
        setTimeout(() => gestureHint.classList.add('hidden'), 700);
      }
    }, 4500);

    // Shutter Trigger Toggle (Start/Stop Bulb Integration)
    shutterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isCapturing = !isCapturing;
      if (isCapturing) {
        shutterCore.classList.remove('bg-primary-container');
        shutterCore.classList.add('bg-signal-record');
        shutterIcon.textContent = 'stop';
        shutterIcon.classList.remove('text-on-primary-container');
        shutterIcon.classList.add('text-text-bright');
      } else {
        shutterCore.classList.remove('bg-signal-record');
        shutterCore.classList.add('bg-primary-container');
        shutterIcon.textContent = 'fiber_manual_record';
        shutterIcon.classList.remove('text-text-bright');
        shutterIcon.classList.add('text-on-primary-container');
      }
    });

    // Double Tap Viewport to Summon Restore Modal
    let lastTapTime = 0;
    root.parentElement.addEventListener('touchend', handleDoubleTap);
    root.parentElement.addEventListener('click', handleDoubleTap);

    function handleDoubleTap(e) {
      if (e.target.closest('#exit-clean-mode-btn') || e.target.closest('#clean-shutter-trigger') || e.target.closest('#control-restore-toast')) {
        return;
      }
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;
      if (tapLength < 350 && tapLength > 0) {
        showRestoreModal();
        e.preventDefault();
      }
      lastTapTime = currentTime;
    }

    function showRestoreModal() {
      restoreToast.classList.remove('hidden');
      restoreToast.classList.add('flex');
    }

    function hideRestoreModal() {
      restoreToast.classList.add('hidden');
      restoreToast.classList.remove('flex');
    }

    toastCancel.addEventListener('click', (e) => {
      e.stopPropagation();
      hideRestoreModal();
    });

    function navigateOut() {
      window.location.hash = '#telemetria';
    }

    exitBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateOut();
    });

    toastConfirm.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateOut();
    });
  })();
</script></main></body></html>
