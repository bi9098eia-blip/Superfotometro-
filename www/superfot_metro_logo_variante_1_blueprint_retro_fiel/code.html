<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="v1Glow" cx="50%" cy="54%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00FFCC" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="100%" stop-color="#00FFCC"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo AMOLED con esquinas app icon -->
  <rect width="512" height="512" rx="112" fill="#06080B"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#00FFCC" stroke-opacity="0.3" stroke-width="2.5"/>

  <!-- Halo de luz central de la lente -->
  <circle cx="270" cy="285" r="135" fill="url(#v1Glow)"/>

  <!-- TRAZOS DEL BOCETO: Sombreado diagonal manual (Hachurado original del dibujo) -->
  <g stroke="#00FFCC" stroke-width="2.5" stroke-linecap="round" opacity="0.35">
    <!-- Rayado diagonal cuerpo izquierdo -->
    <line x1="115" y1="210" x2="165" y2="175"/>
    <line x1="115" y1="250" x2="195" y2="190"/>
    <line x1="115" y1="290" x2="200" y2="230"/>
    <line x1="115" y1="335" x2="205" y2="275"/>
    <line x1="125" y1="380" x2="215" y2="320"/>
    <!-- Rayado diagonal cuerpo derecho -->
    <line x1="335" y1="180" x2="400" y2="230"/>
    <line x1="345" y1="220" x2="400" y2="265"/>
    <line x1="355" y1="260" x2="400" y2="300"/>
    <line x1="340" y1="310" x2="395" y2="355"/>
    <line x1="320" y1="360" x2="385" y2="385"/>
  </g>

  <!-- BASE Y ZÓCALO INFERIOR (Refuerzo del boceto con líneas horizontales) -->
  <g stroke="#00FFCC" stroke-linecap="round" filter="url(#neon)">
    <rect x="96" y="388" width="320" height="20" rx="6" fill="#0C141B" stroke="#00FFCC" stroke-width="6"/>
    <!-- Trazos horizontales de apoyo del dibujo -->
    <line x1="112" y1="398" x2="400" y2="398" stroke="#00FFCC" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- CUERPO PRINCIPAL DE LA CÁMARA (Rectángulo con cantos biselados) -->
  <rect x="96" y="165" width="320" height="225" rx="28" fill="#090E14" fill-opacity="0.85" stroke="url(#cyanGrad)" stroke-width="11" stroke-linejoin="round" filter="url(#neon)"/>

  <!-- ELEMENTOS SUPERIORES DEL BOCETO (Diales, prisma rayado y disparador) -->
  <!-- 1. Prisma central triangular estriado -->
  <polygon points="214,165 240,118 296,118 318,165" fill="#0D161F" stroke="#00FFCC" stroke-width="8" stroke-linejoin="round"/>
  <!-- Rayas del prisma del dibujo -->
  <line x1="248" y1="128" x2="258" y2="155" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="268" y1="128" x2="278" y2="155" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="288" y1="128" x2="298" y2="155" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>

  <!-- 2. Rueda / Dial estriado izquierdo (selector) -->
  <path d="M 125,165 L 125,140 Q 125,130 135,130 L 165,130 Q 175,130 175,140 L 175,165 Z" fill="#0D161F" stroke="#00FFCC" stroke-width="7" stroke-linejoin="round"/>
  <line x1="140" y1="130" x2="140" y2="165" stroke="#00FFCC" stroke-width="3.5"/>
  <line x1="150" y1="130" x2="150" y2="165" stroke="#00FFCC" stroke-width="3.5"/>
  <line x1="160" y1="130" x2="160" y2="165" stroke="#00FFCC" stroke-width="3.5"/>

  <!-- 3. Botón disparador derecho (con cabeza saliente) -->
  <rect x="340" y="142" width="44" height="24" rx="6" fill="#0D161F" stroke="#00FFCC" stroke-width="7"/>
  <rect x="352" y="125" width="20" height="18" rx="4" fill="#00FFCC"/>

  <!-- 4. Pequeño engranaje superior adicional a la derecha -->
  <circle cx="370" cy="115" r="4" fill="#00FFCC" opacity="0.8"/>

  <!-- 5. Visor óptico telemétrico frontal (esquina superior izquierda de la cámara) -->
  <rect x="120" y="188" width="68" height="34" rx="8" fill="#05080C" stroke="#00FFCC" stroke-width="7"/>
  <rect x="128" y="196" width="24" height="18" rx="4" fill="#00FFCC" opacity="0.9"/>
  <!-- Hachurado interior del visor del dibujo -->
  <line x1="160" y1="194" x2="178" y2="216" stroke="#00FFCC" stroke-width="2.5" opacity="0.6"/>
  <line x1="168" y1="194" x2="182" y2="208" stroke="#00FFCC" stroke-width="2.5" opacity="0.6"/>

  <!-- OBJETIVO CENTRAL CONCÉNTRICO (El núcleo del dibujo) -->
  <!-- Anillo exterior con barrilete escalonado -->
  <circle cx="270" cy="285" r="96" fill="#0C141D" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#neon)"/>
  <!-- Anillo de muescas concéntrico -->
  <circle cx="270" cy="285" r="82" fill="none" stroke="#00FFCC" stroke-width="4.5" stroke-dasharray="12 6" opacity="0.85"/>
  <!-- Anillo interior óptico -->
  <circle cx="270" cy="285" r="66" fill="#070C12" stroke="#00FFCC" stroke-width="7"/>

  <!-- RETÍCULA / ENREJADO CUADRADO DEL DIBUJO (Detalle exacto del boceto de la lente) -->
  <g stroke="#00FFCC" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <!-- Líneas horizontales -->
    <line x1="222" y1="262" x2="318" y2="262"/>
    <line x1="210" y1="285" x2="330" y2="285"/>
    <line x1="222" y1="308" x2="318" y2="308"/>
    <!-- Líneas verticales -->
    <line x1="247" y1="237" x2="247" y2="333"/>
    <line x1="270" y1="225" x2="270" y2="345"/>
    <line x1="293" y1="237" x2="293" y2="333"/>
    <!-- Cuadrícula secundaria de textura diagonal del boceto -->
    <line x1="238" y1="250" x2="302" y2="318" stroke-width="2" opacity="0.4"/>
    <line x1="238" y1="318" x2="302" y2="250" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Destello curvo sobre el cristal -->
  <path d="M 235 250 A 50 50 0 0 1 305 250" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- ACCESORIOS LATERALES DE LA LENTE (Del dibujo: palanca, tope y sensor) -->
  <!-- 1. Palanca angular inferior izquierda -->
  <g transform="translate(192, 335) rotate(-35)">
    <rect x="-9" y="-20" width="18" height="38" rx="6" fill="#0C141D" stroke="#00FFCC" stroke-width="6"/>
    <circle cx="0" cy="-6" r="3" fill="#00FFCC"/>
  </g>
  <!-- 2. Palanca lateral izquierda -->
  <rect x="175" y="272" width="16" height="24" rx="4" fill="#00FFCC"/>

  <!-- 3. Sensor / Luz piloto inferior derecha de la lente -->
  <circle cx="355" cy="350" r="14" fill="#0C141D" stroke="#00FFCC" stroke-width="5"/>
  <circle cx="355" cy="350" r="6" fill="#FF007F"/>
</svg>
