<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00FFCC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00BFA5"/>
    </linearGradient>
    <linearGradient id="magentaBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Dark AMOLED con esquinas redondeadas modernas -->
  <rect width="512" height="512" rx="112" fill="#0A0D12"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#00FFCC" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Halo de resplandor central -->
  <circle cx="256" cy="256" r="160" fill="url(#coreGlow)"/>

  <!-- Apertura fotográfica geométrica / Diafragma cinético de luz -->
  <!-- Anillo exterior métrico de fotómetro -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00FFCC" stroke-width="4" stroke-dasharray="8 14" opacity="0.4"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#00FFCC" stroke-width="6" opacity="0.8"/>

  <!-- Aspas del diafragma / Pinceles de luz en espiral -->
  <g filter="url(#glow)">
    <!-- Aspa 1 -->
    <path d="M 256 108 C 300 108 348 135 372 176 L 314 210 C 298 184 272 168 244 168 Z" fill="url(#neonCyan)"/>
    <!-- Aspa 2 -->
    <path d="M 404 256 C 404 300 377 348 336 372 L 302 314 C 328 298 344 272 344 244 Z" fill="url(#neonCyan)" opacity="0.9"/>
    <!-- Aspa 3 -->
    <path d="M 256 404 C 212 404 164 377 140 336 L 198 302 C 214 328 240 344 268 344 Z" fill="url(#neonCyan)" opacity="0.8"/>
    <!-- Aspa 4 -->
    <path d="M 108 256 C 108 212 135 164 176 140 L 210 198 C 184 214 168 240 168 268 Z" fill="url(#neonCyan)" opacity="0.7"/>
  </g>

  <!-- Haz estela dinámico de Light Painting (S de Super / infinito) -->
  <path d="M 170 330 C 140 250 210 170 280 180 C 350 190 360 270 270 300 C 230 315 205 340 215 365" 
        fill="none" stroke="url(#magentaBeam)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Punto cuántico / sensor central de fotómetro -->
  <circle cx="256" cy="256" r="32" fill="#0A0D12" stroke="#00FFCC" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#00FFCC"/>
  <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>

  <!-- Marcas de calibración angular del fotómetro -->
  <g stroke="#00FFCC" stroke-width="3" opacity="0.6">
    <line x1="256" y1="64" x2="256" y2="78"/>
    <line x1="256" y1="434" x2="256" y2="448"/>
    <line x1="64" y1="256" x2="78" y2="256"/>
    <line x1="434" y1="256" x2="448" y2="256"/>
  </g>
</svg>
