<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtro de textura de tinta rugosa / trazo analógico de pluma -->
    <filter id="inkRoughness" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <radialGradient id="paperGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F1722"/>
      <stop offset="70%" stop-color="#080C11"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <linearGradient id="inkGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38F9D7"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
    <linearGradient id="inkGradBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D63FF"/>
      <stop offset="100%" stop-color="#00FFCC"/>
    </linearGradient>
  </defs>

  <!-- Fondo Icono App: Papel oscuro de bloc de notas de diseñador / blueprint -->
  <rect width="512" height="512" rx="112" fill="url(#paperGlow)"/>
  
  <!-- Cuadrícula sutil de cuaderno de bocetos (Grid de papel milimetrado tenue) -->
  <g stroke="#00E5FF" stroke-width="0.75" opacity="0.08">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Borde exterior del icono con doble pasada manual -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#00FFCC" stroke-width="2.5" opacity="0.25" stroke-dasharray="14 8 20 4"/>
  <rect x="14" y="15" width="484" height="483" rx="102" fill="none" stroke="#00B4D8" stroke-width="1.5" opacity="0.18"/>

  <!-- GRUPO PRINCIPAL DE TRAZOS DE PLUMA (ESTILO BOCETO A MANO ALZADA) -->
  <g filter="url(#inkRoughness)">

    <!-- 1. HACHURADO Y SOMBREADO DIAGONAL A PLUMA EN EL CUERPO (MULTITRAZOS VIVOS) -->
    <g stroke="url(#inkGradCyan)" stroke-linecap="round" opacity="0.45">
      <!-- Sombreado diagonal cuerpo izquierdo -->
      <path d="M 108 220 L 175 168" stroke-width="2.8"/>
      <path d="M 104 246 L 195 180" stroke-width="3.2"/>
      <path d="M 102 276 L 210 198" stroke-width="3.0"/>
      <path d="M 100 308 L 215 224" stroke-width="3.4"/>
      <path d="M 98 340 L 210 258" stroke-width="2.9"/>
      <path d="M 102 368 L 198 298" stroke-width="3.1"/>
      <path d="M 112 392 L 180 340" stroke-width="2.6"/>

      <!-- Sombreado diagonal cuerpo derecho -->
      <path d="M 330 184 L 410 248" stroke-width="3.0"/>
      <path d="M 342 216 L 415 272" stroke-width="3.2"/>
      <path d="M 352 248 L 418 298" stroke-width="2.8"/>
      <path d="M 346 288 L 416 338" stroke-width="3.3"/>
      <path d="M 334 326 L 412 376" stroke-width="3.1"/>
      <path d="M 320 365 L 398 402" stroke-width="2.7"/>

      <!-- Contrahachurado cruzado expresivo (Cross-hatching de pluma) -->
      <path d="M 115 190 L 165 240" stroke-width="2.2" opacity="0.6"/>
      <path d="M 125 220 L 185 275" stroke-width="2.0" opacity="0.5"/>
      <path d="M 355 220 L 405 180" stroke-width="2.4" opacity="0.6"/>
      <path d="M 370 250 L 412 215" stroke-width="2.0" opacity="0.5"/>
    </g>

    <!-- 2. SILUETA DEL CUERPO DE LA CÁMARA (LÍNEAS ORGÁNICAS CON DOBLE Y TRIPLE PASADA DE PLUMA) -->
    <!-- Pasada 1: Trazo base firme -->
    <path d="M 114 172 Q 100 174 98 190 L 94 374 Q 96 392 116 394 L 398 396 Q 416 394 418 376 L 416 192 Q 414 174 396 172 Z"
          fill="#080E14" fill-opacity="0.6" stroke="url(#inkGradCyan)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Pasada 2: Segunda línea de tinta espontánea superpuesta -->
    <path d="M 110 169 L 400 170 L 420 188 L 418 378 L 398 398 L 94 396 L 92 188 L 112 169"
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.75" stroke-linecap="round"/>

    <!-- Pasada 3: Trazos sueltos de lápiz/pluma en las esquinas -->
    <path d="M 88 180 L 105 168 M 405 168 L 424 184 M 422 380 L 404 402 M 90 382 L 108 402"
          stroke="#00FFCC" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- 3. BASE INFERIOR REFORZADA (RALLADO HORIZONTAL A MANO ALZADA COMO EN EL DIBUJO) -->
    <path d="M 84 404 Q 256 400 426 405" stroke="url(#inkGradCyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 92 414 Q 256 410 418 415" stroke="url(#inkGradCyan)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Trazos de hachurado horizontal tupido en la base -->
    <g stroke="#00FFCC" stroke-width="2.8" stroke-linecap="round" opacity="0.65">
      <line x1="102" y1="406" x2="128" y2="416"/>
      <line x1="138" y1="406" x2="164" y2="416"/>
      <line x1="174" y1="406" x2="200" y2="416"/>
      <line x1="210" y1="406" x2="236" y2="416"/>
      <line x1="246" y1="406" x2="272" y2="416"/>
      <line x1="282" y1="406" x2="308" y2="416"/>
      <line x1="318" y1="406" x2="344" y2="416"/>
      <line x1="354" y1="406" x2="380" y2="416"/>
      <line x1="390" y1="406" x2="414" y2="416"/>
    </g>

    <!-- 4. ELEMENTOS MECÁNICOS SUPERIORES DIBUJADOS A PLUMA -->
    <!-- Dial Izquierdo (Selector moleteado con líneas verticales a pluma) -->
    <path d="M 126 172 L 124 136 Q 125 128 134 128 L 168 127 Q 176 128 178 136 L 176 172"
          fill="#0A121A" stroke="url(#inkGradCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 128 132 L 174 132" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <!-- Rayado vertical del dial -->
    <g stroke="#00FFCC" stroke-width="3" stroke-linecap="round">
      <line x1="138" y1="134" x2="136" y2="168"/>
      <line x1="148" y1="132" x2="148" y2="169"/>
      <line x1="158" y1="133" x2="159" y2="168"/>
      <line x1="168" y1="135" x2="169" y2="167"/>
    </g>

    <!-- Prisma Central Piramidal Estriado (El prisma del visor con sus rayos diagonales) -->
    <path d="M 212 172 L 236 122 Q 240 116 248 116 L 288 116 Q 296 116 300 122 L 322 172 Z"
          fill="#0B141E" stroke="url(#inkGradCyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 240 122 L 296 122" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <!-- Rayado interno característico del boceto en el prisma -->
    <g stroke="url(#inkGradCyan)" stroke-width="4.5" stroke-linecap="round">
      <line x1="250" y1="126" x2="260" y2="162"/>
      <line x1="266" y1="124" x2="276" y2="164"/>
      <line x1="282" y1="126" x2="292" y2="162"/>
    </g>
    <!-- Trazo suelto de boceto que sobrepasa el prisma -->
    <line x1="230" y1="132" x2="242" y2="110" stroke="#00FFCC" stroke-width="2.5" opacity="0.75"/>

    <!-- Disparador Derecho con Botón Moleteado -->
    <path d="M 338 172 L 340 144 Q 341 138 348 138 L 382 138 Q 388 138 390 144 L 388 172"
          fill="#0A121A" stroke="url(#inkGradCyan)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Pulsador cilíndrico superior -->
    <path d="M 352 138 L 352 120 Q 353 115 362 115 L 372 115 Q 380 115 380 120 L 380 138"
          fill="#00FFCC" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="360" y1="122" x2="374" y2="122" stroke="#000000" stroke-width="2.5"/>

    <!-- Visor Óptico Frontal (Rectángulo telemétrico con hachurado cruzado a mano) -->
    <path d="M 120 196 Q 119 190 126 190 L 184 190 Q 192 191 192 198 L 190 228 Q 189 236 182 236 L 126 236 Q 119 235 120 228 Z"
          fill="#05090E" stroke="url(#inkGradCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ventanilla interior con relleno cian -->
    <rect x="128" y="198" width="26" height="28" rx="4" fill="#00FFCC" opacity="0.85"/>
    <!-- Rayado diagonal suelto en la otra mitad del visor óptico -->
    <g stroke="#00FFCC" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <line x1="162" y1="196" x2="184" y2="228"/>
      <line x1="172" y1="196" x2="188" y2="218"/>
      <line x1="158" y1="210" x2="174" y2="232"/>
    </g>

    <!-- 5. EL GRAN OBJETIVO CENTRAL (NÚCLEO DEL BOCETO A PLUMA) -->
    <!-- Aro exterior con doble pasada a mano alzada -->
    <ellipse cx="268" cy="286" rx="98" ry="96" fill="#0A121B" stroke="url(#inkGradCyan)" stroke-width="7"/>
    <ellipse cx="270" cy="285" rx="101" ry="99" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

    <!-- Aro de escala y muescas del objetivo dibujado a pluma (Rayado concéntrico artesanal) -->
    <ellipse cx="268" cy="286" rx="84" ry="83" fill="none" stroke="#00FFCC" stroke-width="4" stroke-dasharray="8 6 12 5"/>
    <ellipse cx="268" cy="286" rx="70" ry="69" fill="#050A0F" stroke="url(#inkGradCyan)" stroke-width="5.5"/>

    <!-- RETÍCULA TÉCNICA / CUADRÍCULA ENREJADA DENTRO DEL OBJETIVO (Detalle icono del boceto) -->
    <!-- Trazos horizontales de pluma -->
    <g stroke="#00FFCC" stroke-linecap="round" opacity="0.9">
      <path d="M 218 258 Q 268 260 318 257" stroke-width="3.8"/>
      <path d="M 206 285 Q 268 286 332 284" stroke-width="4.5"/>
      <path d="M 218 312 Q 268 311 318 313" stroke-width="3.8"/>
      
      <!-- Trazos verticales de pluma -->
      <path d="M 242 228 Q 240 286 243 342" stroke-width="3.8"/>
      <path d="M 268 216 Q 269 286 268 356" stroke-width="4.5"/>
      <path d="M 294 228 Q 296 286 293 342" stroke-width="3.8"/>

      <!-- Hachurado de textura y sombras cruzadas internas de la lente como en el dibujo a bolígrafo -->
      <line x1="228" y1="242" x2="308" y2="328" stroke-width="2.2" opacity="0.45"/>
      <line x1="240" y1="234" x2="318" y2="316" stroke-width="2.2" opacity="0.45"/>
      <line x1="228" y1="328" x2="308" y2="242" stroke-width="2.2" opacity="0.45"/>
      <line x1="218" y1="300" x2="296" y2="226" stroke-width="2.2" opacity="0.45"/>
    </g>

    <!-- Destello semicircular de luz sobre el cristal de la lente dibujado con trazo blanco -->
    <path d="M 232 250 A 48 48 0 0 1 306 250" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 240 244 A 40 40 0 0 1 298 244" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- 6. ACCESORIOS LATERALES DEL BOCETO (Palanca angular y sensor telemétrico) -->
    <!-- Palanca angular izquierda inferior del barrilete -->
    <g transform="translate(188, 338) rotate(-32)">
      <rect x="-8" y="-18" width="16" height="34" rx="4" fill="#00FFCC" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="0" cy="-6" r="3" fill="#080E14"/>
    </g>
    <!-- Pequeño tope lateral izquierdo -->
    <rect x="170" y="274" width="14" height="22" rx="3" fill="#00FFCC" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Sensor / Luz de fotometría inferior derecha (Punto acento con halo) -->
    <circle cx="356" cy="352" r="14" fill="#080E14" stroke="url(#inkGradCyan)" stroke-width="4.5"/>
    <circle cx="356" cy="352" r="7" fill="#FF007F"/>
    <circle cx="356" cy="352" r="2.5" fill="#FFFFFF"/>

    <!-- 7. MANCHAS Y SALPICADURAS ARTÍSTICAS DE TINTA (Puntos de pluma estilográfica auténticos) -->
    <circle cx="372" cy="112" r="3.5" fill="#00FFCC"/>
    <circle cx="382" cy="104" r="2" fill="#00FFCC" opacity="0.7"/>
    <circle cx="86" cy="162" r="2.5" fill="#00E5FF" opacity="0.8"/>
    <circle cx="430" cy="390" r="3" fill="#00FFCC" opacity="0.6"/>
    <circle cx="106" cy="426" r="2" fill="#38F9D7" opacity="0.5"/>
  </g>
</svg>
