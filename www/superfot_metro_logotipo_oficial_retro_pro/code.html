<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00FFCC" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2228"/>
      <stop offset="100%" stop-color="#0A0D12"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Dark AMOLED con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="#0A0D12"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#00FFCC" stroke-opacity="0.2" stroke-width="3"/>

  <!-- Resplandor central de la lente -->
  <circle cx="270" cy="280" r="140" fill="url(#lensGlow)"/>

  <!-- CUERPO DE LA CÁMARA (Inspirado en el boceto) -->
  <!-- Silueta externa del chasis -->
  <rect x="96" y="160" width="320" height="230" rx="36" fill="url(#bodyGrad)" stroke="#00FFCC" stroke-width="12" stroke-linejoin="round" filter="url(#neonBlur)"/>

  <!-- Placa base de apoyo inferior -->
  <path d="M 110 376 L 402 376" stroke="#00FFCC" stroke-width="10" stroke-linecap="round"/>
  <path d="M 124 394 L 388 394" stroke="#00FFCC" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Hachurado / Textura técnica inspirada en el boceto a bolígrafo azul -->
  <g stroke="#00FFCC" stroke-width="3" stroke-linecap="round" opacity="0.22">
    <line x1="120" y1="180" x2="160" y2="160"/>
    <line x1="120" y1="220" x2="200" y2="180"/>
    <line x1="120" y1="260" x2="210" y2="215"/>
    <line x1="330" y1="180" x2="400" y2="215"/>
    <line x1="360" y1="220" x2="400" y2="240"/>
    <line x1="370" y1="270" x2="400" y2="285"/>
  </g>

  <!-- ELEMENTOS SUPERIORES (Diales, prisma y disparador) -->
  <!-- Prisma / Visor cenital central -->
  <polygon points="210,160 236,120 286,120 306,160" fill="#131B22" stroke="#00FFCC" stroke-width="10" stroke-linejoin="round"/>
  <!-- Rayas del prisma central (detalle del boceto) -->
  <line x1="244" y1="130" x2="254" y2="152" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="262" y1="130" x2="272" y2="152" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>
  <line x1="280" y1="130" x2="290" y2="152" stroke="#00FFCC" stroke-width="4" stroke-linecap="round"/>

  <!-- Dial izquierdo (rebobinado / selector ISO) -->
  <rect x="130" y="132" width="46" height="28" rx="8" fill="#131B22" stroke="#00FFCC" stroke-width="9" stroke-linejoin="round"/>
  <line x1="144" y1="126" x2="144" y2="132" stroke="#00FFCC" stroke-width="6" stroke-linecap="round"/>
  <line x1="162" y1="126" x2="162" y2="132" stroke="#00FFCC" stroke-width="6" stroke-linecap="round"/>

  <!-- Botón disparador derecho -->
  <rect x="344" y="136" width="38" height="24" rx="6" fill="#131B22" stroke="#00FFCC" stroke-width="9" stroke-linejoin="round"/>
  <rect x="355" y="122" width="16" height="14" rx="4" fill="#00FFCC"/>

  <!-- Visor óptico telemétrico frontal (esquina superior izquierda de la cámara) -->
  <rect x="126" y="184" width="62" height="34" rx="8" fill="#0A0D12" stroke="#00FFCC" stroke-width="8"/>
  <rect x="136" y="192" width="22" height="18" rx="4" fill="#00FFCC" opacity="0.8"/>

  <!-- OBJETIVO / LENTE CENTRAL CONCÉNTRICA -->
  <!-- Anillo exterior con muescas del barril -->
  <circle cx="270" cy="280" r="92" fill="#131B22" stroke="#00FFCC" stroke-width="12" filter="url(#neonBlur)"/>
  
  <!-- Anillo de enfoque intermedio -->
  <circle cx="270" cy="280" r="76" fill="#0A0D12" stroke="#00FFCC" stroke-width="6" stroke-dasharray="14 8"/>

  <!-- Elemento óptico principal con rejilla de apertura (detalle exacto del dibujo) -->
  <circle cx="270" cy="280" r="60" fill="#0E161C" stroke="#00FFCC" stroke-width="8"/>

  <!-- Cuadrícula / Enrejado interno del objetivo (del boceto a mano alzada) -->
  <g stroke="#00FFCC" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <!-- Líneas cruzadas diagonales -->
    <line x1="230" y1="260" x2="310" y2="260"/>
    <line x1="222" y1="280" x2="318" y2="280"/>
    <line x1="230" y1="300" x2="310" y2="300"/>
    <line x1="250" y1="240" x2="250" y2="320"/>
    <line x1="270" y1="232" x2="270" y2="328"/>
    <line x1="290" y1="240" x2="290" y2="320"/>
  </g>

  <!-- Destello / Reflejo curvo del cristal de la lente -->
  <path d="M 238 248 A 46 46 0 0 1 298 248" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>

  <!-- Palancas y diales laterales de la lente (del boceto) -->
  <!-- Palanca inferior izquierda -->
  <g transform="translate(194, 326) rotate(-35)">
    <rect x="-10" y="-18" width="20" height="36" rx="6" fill="#131B22" stroke="#00FFCC" stroke-width="7"/>
    <circle cx="0" cy="0" r="4" fill="#00FFCC"/>
  </g>
  <!-- Palanca lateral izquierda -->
  <rect x="180" y="268" width="16" height="24" rx="5" fill="#00FFCC"/>

  <!-- Luz piloto / Sensor de fotómetro (esquina inferior derecha de la lente) -->
  <circle cx="352" cy="344" r="12" fill="#0A0D12" stroke="#00FFCC" stroke-width="6"/>
  <circle cx="352" cy="344" r="5" fill="#FF007F"/>
</svg>
