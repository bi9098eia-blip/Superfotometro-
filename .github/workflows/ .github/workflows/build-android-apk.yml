name: Compilar APK en la Nube

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libstdc++6 make
          pip install --upgrade pip
          pip install buildozer cython

      - name: Compilar APK (Modo Debug)
        run: |
          buildozer -v android debug

      - name: Subir APK generado como Artifact
        uses: actions/upload-artifact@v3
        with:
          name: superfotometro-debug-apk
          path: bin/*.apk
